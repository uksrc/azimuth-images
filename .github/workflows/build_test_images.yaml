---
# yamllint disable rule:line-length
name: Build, publish and test images

on:  # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      OS_CLOUDS:
        description: clouds.yaml file
        required: true
      S3_ACCESS_KEY:
        description: S3 access key
        required: true
      S3_SECRET_KEY:
        description: S3 secret key
        required: true

jobs:
  read_builds:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.builds-as-json.outputs.builds }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install script dependencies
        run: pip install -r ./requirements.txt

      - name: Get builds as JSON
        id: builds-as-json
        run: ./bin/builds-as-json

  ensure_source_image:
    needs:
      - read_builds
    runs-on: ubuntu-latest
    outputs:
      source_image: ${{ steps.download_source.outputs.source_image_name }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install script dependencies
        run: pip install -r ./requirements.txt

      - name: Write OpenStack credentials
        run: echo "$OS_CLOUDS" > ./clouds.yaml
        env:
          OS_CLOUDS: ${{ secrets.OS_CLOUDS }}

      - name: Download source image and upload to OpenStack
        id: download_source
        run: ./bin/ensure-source-image
        env:
          BUILD_MATRIX: ${{ needs.read_builds.outputs.builds }}
          REPO_ROOT: ${{ github.workspace }}
          GH_ACTIONS_RUN: "true"
          OS_CLOUD: ${{ vars.TARGET_CLOUD }}

  build_images:
    needs:
      - read_builds
      - ensure_source_image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read_builds.outputs.builds) }}
    name: ${{ matrix.name }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write  # required to get an OIDC token for signing
      security-events: write  # required to upload SARIF files
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Write OpenStack credentials
        run: echo "$OS_CLOUDS" > ./clouds.yaml
        env:
          OS_CLOUDS: ${{ secrets.OS_CLOUDS }}

      - name: Set up Packer environment
        run: ./bin/setup
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build-image
        run: ./bin/build-image
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the image on the target cloud
          OS_CLOUD: ${{ vars.TARGET_CLOUD }}
          ENVIRONMENT: ${{ vars.TARGET_CLOUD }}
          PACKER_TEMPLATE: ${{ matrix.template }}
          ENV_VAR_FILES: ${{ matrix.var-files }}
          PKR_VAR_source_image_name: ${{ needs.ensure_source_image.outputs.source_image }}
          SKIP_SOURCE_IMAGE: "false"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: install libguestfs
        run: sudo apt-get -y install libguestfs-tools

      - name: mkdir for mount
        run: sudo mkdir -p "./${STEPS_BUILD_IMAGE_OUTPUTS_IMAGE_NAME}"
        env:
          STEPS_BUILD_IMAGE_OUTPUTS_IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}

      - name: mount qcow2 file
        run: >
          sudo guestmount -a
          "${STEPS_BUILD_IMAGE_OUTPUTS_IMAGE_DEST_FILE}"
          -i --ro -o allow_other
          "./${STEPS_BUILD_IMAGE_OUTPUTS_IMAGE_NAME}"
        env:
          STEPS_BUILD_IMAGE_OUTPUTS_IMAGE_DEST_FILE: ${{ steps.build-image.outputs.image-dest-file }}
          STEPS_BUILD_IMAGE_OUTPUTS_IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}

      - name: Generate sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        id: generate-sbom
        with:
          path: "${{ steps.build-image.outputs.image-name }}"
          artifact-name: "${{ steps.build-image.outputs.image-name }}-sbom.json"
          output-file: "${{ steps.build-image.outputs.image-name }}-sbom.json"
          format: syft-json

      - name: Fail if scan has CRITICAL vulnerabilities
        uses: anchore/scan-action@7037fa011853d5a11690026fb85feee79f4c946c
        with:
          sbom: "${{ steps.build-image.outputs.image-name }}-sbom.json"
          output-format: table
          severity-cutoff: critical
          only-fixed: true

      - name: Publish image
        id: publish-image
        run: ./bin/publish-image
        env:
          IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}
          IMAGE_DISK_FORMAT: ${{ steps.build-image.outputs.image-disk-format }}
          # Upload images to a fixed S3 host
          S3_HOST: ${{ vars.S3_HOST }}
          S3_HOST_PUBLIC_PATH: ${{ vars.S3_HOST_PUBLIC_PATH }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}

      - name: Write matrix outputs
        uses: cloudposse/github-action-matrix-outputs-write@ed06cf3a6bf23b8dce36d1cf0d63123885bb8375 # v1
        with:
          matrix-step-name: ${{ github.job }}
          matrix-key: ${{ matrix.name }}
          outputs: |-
            name: ${{ steps.publish-image.outputs.image-name }}
            url: ${{ steps.publish-image.outputs.image-url }}
            checksum: ${{ steps.publish-image.outputs.image-checksum }}
            checksum_sha512: ${{ steps.publish-image.outputs.image-checksum-sha512 }}
            cosign-bundle-url: ${{ steps.publish-image.outputs.cosign-bundle-url }}
            image-sbom-url: ${{ steps.publish-image.outputs.image-sbom-url }}
            manifest-extra: ${{ steps.build-image.outputs.manifest-extra }}
