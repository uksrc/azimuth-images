on:  # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      OS_CLOUDS:
        description: clouds.yaml file
        required: true
      CLOUDFLARE_S3_ACCESS_KEY:
        description: S3 access key
        required: true
      CLOUDFLARE_S3_SECRET_KEY:
        description: S3 secret key
        required: true

jobs:
  read_builds:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.builds-as-json.outputs.builds }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install script dependencies
        run: pip install -r ./requirements.txt

      - name: Get builds as JSON
        id: builds-as-json
        run: ./bin/builds-as-json

  ensure_source_image:
    needs:
      - read_builds
    runs-on: ubuntu-latest
    outputs:
      source_image: ${{ steps.download_source.outputs.source_image_name }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install script dependencies
        run: pip install -r ./requirements.txt

      - name: Write OpenStack credentials
        run: echo "$OS_CLOUDS" > ./clouds.yaml
        env:
          OS_CLOUDS: ${{ secrets.OS_CLOUDS }}

      - name: Download source image and upload to OpenStack
        id: download_source
        run: ./bin/ensure-source-image
        env:
          BUILD_MATRIX: ${{ needs.read_builds.outputs.builds }}
          REPO_ROOT: ${{ github.workspace }}
          GH_ACTIONS_RUN: "true"
          OS_CLOUD: ${{ vars.TARGET_CLOUD }}

  build_images:
    needs:
      - read_builds
      - ensure_source_image
