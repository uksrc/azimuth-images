---
name: Build and test PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

jobs:
  # This job exists so that PRs from outside the main repo are rejected
  fail_on_remote:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: PR must be from a branch in the uksrc/azimuth-images repo
        run: |
          if [ "${{ github.repository }}" != "uksrc/azimuth-images" ]; then
            exit 1
          fi

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      packages: write
      statuses: write
    needs:
      - fail_on_remote

  # Build, publish and test the images
  build_test_images:
    needs:
      - fail_on_remote
      - lint
    # Don't build draft PRs
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/build_test_images.yaml
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write  # required to get an OIDC token for signing
      security-events: write  # required to upload SARIF files
    secrets:
      OS_CLOUDS: ${{ secrets.OS_CLOUDS }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
