---
name: Build and test PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    branches:
      - main

jobs:
  # This job exists so that PRs from outside the main repo are rejected
  fail_on_remote:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: PR must be from a branch in the uksrc/azimuth-images repo
        run: |
          if [ "${{ github.repository }}" != "uksrc/azimuth-images" ]; then
            exit 1
          fi

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      packages: write
      statuses: write
    needs:
      - fail_on_remote
